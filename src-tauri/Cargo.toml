[package]
name = "interview-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hound = "=3.5.1"
dirs = "=6.0.0"
tauri = { version = "=2.11.5", features = ["tray-icon"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.182"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "=0.18.2"
interprocess = "=2.4.4"
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [], optional = true }

[dev-dependencies]
tempfile = "=3.25.0"

[[bin]]
name = "interview-helper"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
