name: Portable core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked
